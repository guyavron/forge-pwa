# Supabase's free plan pauses a project after a week with no database activity,
# which takes the live demo down. This runs a tiny read every 3 days so that
# never happens. The read returns no rows (RLS hides every row from a request
# with no signed-in user), but it still reaches the database, which is enough.
name: Keep database awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/meals?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Database answered with HTTP $status"
          test "$status" = "200"
