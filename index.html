<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0B0B0F" />

    <!-- iOS "Add to Home Screen" needs these legacy tags in addition to the web manifest —
         without apple-mobile-web-app-capable, Safari opens it as a normal browser tab (with
         the URL bar) instead of a standalone full-screen app, even with a valid manifest. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Forge" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Forge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
